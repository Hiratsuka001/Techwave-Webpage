<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechWave</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="font">
    <nav class="navbar">
      <div class="logo">Tech<span class="logo-color">Wave</span></div>

      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#episodes">Episodes</a></li>
        <li><a href="#host">Host</a></li>
      </ul>

      <button class="subscribe-btn">
        Subscribe
        <span class="arrow"><i class="fa-solid fa-arrow-right"></i></span>
      </button>
    </nav>
    <section class="banner">
      <div class="banner-content">
        <div class="banner-container">
          <span class="new-badge">NEW</span>
          <img
            src="assets/hero-circle.png"
            alt="Gradient Background"
            class="circle"
          />
          <img src="assets/microphone.png" alt="Microphone" class="mic" />
        </div>

        <h1 class="banner-title">TechWave</h1>
        <p class="banner-subtitle">
          Your daily dose of tech insights, productivity hacks, and personal
          growth
        </p>

        <div class="banner-actions">
          <button class="btn-spotify">
            <img src="assets/spotify.png" alt="Spotify" /> Listen On Spotify
          </button>
          <button class="btn-subscribe">
            <img src="assets/message.png" alt="Message Icon" /> Subscribe
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
